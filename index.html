function dueOn(day0,days){var d=pd(day0),n=0;while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);while(n<days){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)n++}return iso(d)}
function fmt(s){return s?pd(s).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'-'}
function fmtLong(s){return s?pd(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}):'-'}
function addr(s){var m=/<([^>]+)>/.exec(s||'');return ((m?m[1]:s)||'').trim().toLowerCase()}
function dom(a){return (String(a).split('@')[1]||'').toLowerCase()}
function unq(s){var t=document.createElement('textarea');t.innerHTML=s||'';return t.value}
var TODAY=iso(new Date());
var AUTO=/^\s*(\[[^\]]*\]\s*)*(automatic reply|auto(matic)?[- ]?(reply|response)|out of (the )?office|autoreply)/i;
var STATUS={};D.statuses.forEach(function(s){STATUS[s.name]=s});
var DERIVED=D.ui.derived;
var STOPS=D.ui.stops;
var byEmail={},byKey={};D.pipeline.forEach(function(p){if(p.email)byEmail[p.email]=p;byKey[p.key]=p});
function capToday(){if(!D.first_push)return D.cfg.ramp[0];var w=Math.floor((pd(TODAY)-pd(D.first_push))/(7*864e5));return D.cfg.ramp[Math.max(0,Math.min(w,D.cfg.ramp.length-1))]}


function threads(){
  var T={};
  D.cadence.forEach(function(c){
    T[c.email]={email:c.email,key:c.key,firm:c.firm,to:c.to,phone:c.phone,seat:c.seat,posted:c.posted,age:c.age,variant:c.variant,kind:c.kind,
      sent:c.touches.filter(function(t){return t.sent}).map(function(t){return nz(t.sent)}).sort(),
      drafted:c.touches.some(function(t){return !t.sent&&t.drafted}),subject:c.subject,body:c.body,calls:c.calls,calld:c.calld||{},
      replied:nz(c.replied),lastReply:nz(c.replied),replyText:'',reply:c.reply,opted:c.opted,bounced:c.bounced,ended:c.ended,next:c.next_action,auto:/auto-reply/.test(c.notes)?c.notes:''};
  });
  var L=S.live; if(!L) return T;
  Object.keys(L.sentTo).forEach(function(a){
    var p=byEmail[a],t=T[a];
    if(!t){ if(!p) return; var m=L.sentTo[a][0];
      t=T[a]={email:a,key:p.key,firm:p.firm,to:(unq(m.preview).split(',')[0]||'').slice(0,24),phone:p.phone,seat:p.seat,posted:p.posted,age:'',variant:'',kind:'cold',
        sent:[],drafted:false,subject:m.subject,body:unq(m.preview)+' …',calls:{},replied:'',lastReply:'',replyText:'',reply:'',opted:false,bounced:false,ended:false,next:'',auto:''}; }
    t.sent=L.sentTo[a].map(function(m){return m.ts}).sort();
  });
  Object.keys(T).forEach(function(a){T[a].draft=!!L.draftTo[a]});
  L.inbox.forEach(function(m){
    var from=addr(m.sender); if(from===ME) return;
    if(/mailer-daemon|postmaster/.test(from)){Object.keys(T).forEach(function(a){if(unq(m.preview).toLowerCase().indexOf(a)>=0)T[a].bounced=true});return}
    var cand=T[from]?[T[from]]:Object.keys(T).map(function(a){return T[a]}).filter(function(t){return dom(t.email)===dom(from)&&t.sent.length});
    if(!cand.length) return;
    var t=cand.sort(function(x,y){return (y.sent[0]||'')<(x.sent[0]||'')?-1:1})[0];
    if(!t.sent.length||m.ts<t.sent[0]) return;
    if(AUTO.test(m.subject||'')){t.auto='Out of office '+fmt(localDay(m.ts))+': '+unq(m.preview).slice(0,220);return}
    if(!t.replied||m.ts<t.replied){t.replied=m.ts;t.replyText=unq(m.preview);t.replyFrom=from}
    if(!t.lastReply||m.ts>t.lastReply)t.lastReply=m.ts;   
  });
  return T;
}
function doc(k){return S.docs.pipeline[k]||null}
function oid(k,slot){return k+'~'+slot}            
function odoc(k,slot){return S.docs.outcomes[oid(k,slot)]||null}
function outcome(k,slot){var d=odoc(k,slot);return d?(d.outcome||''):''}
function addBiz(n){var d=pd(TODAY),c=0;while(c<n){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)c++}return iso(d)}

function cbRaw(p){var d=doc(p.key);return d&&d.callback!=null?{date:d.callback||'',at:d.callback_at||(d.callback?d.at:'')||''}:{date:p.hcallback||'',at:p.hcallback_at||''}}
function cbOf(p){var r=cbRaw(p);return /^\d{4}-\d{2}-\d{2}$/.test(r.date)?{date:r.date,at:nz(r.at)}:null}

function cbState(p,t){
  var cb=cbOf(p);if(!cb)return null;
  var o=['1','2','cb'].map(function(s){return odoc(p.key,s)}).filter(function(d){var w=d&&nz(d.edited||d.at);return d&&d.outcome&&w>cb.at&&localDay(w)>=cb.date})[0];
  
  if(!o&&t&&t.calld)o=['1','2'].map(function(s){return t.calls[s]&&t.calld[s]&&t.calld[s]>=cb.date&&t.calld[s]>=localDay(cb.at)?{outcome:t.calls[s]}:null}).filter(Boolean)[0];
  cb.why=(t&&t.opted)||statusOf(p,S.T||{}).name===D.ui.n.s_dnc?D.ui.n.s_dnc.toLowerCase():(t&&t.lastReply&&t.lastReply>cb.at?'they replied '+fmt(localDay(t.lastReply)):(o?'a call was logged ('+o.outcome+')':''));
  return cb;
}

function cbWait(t){var p=byKey[t.key]||byEmail[t.email],c=p&&cbOpen(p,t);return c&&c.date>=TODAY?'<span class="pill">Waiting on the call-back '+fmt(c.date)+'</span>':''}
function cbOpen(p,t){var cb=cbState(p,t);return cb&&!cb.why?cb:null}
function cbDue(p,t){var cb=cbOpen(p,t);return cb&&cb.date<=TODAY?cb:null}
function stub(p){return {email:p.email||'',key:p.key,firm:p.firm,to:p.partner||'',phone:p.phone||'',seat:p.seat||'',posted:p.posted||'',age:'',variant:'',kind:'cold',
  sent:[],drafted:false,subject:'',body:'',calls:{},replied:'',lastReply:'',replyText:'',reply:'',opted:false,bounced:false,ended:false,next:'',auto:''}}
function stepsOf(t){
  if(!t.sent.length)return [];
  var p=byEmail[t.email]||{key:t.key},k=p.key,day0=localDay(t.sent[0]),out=[];
  D.cfg.call.forEach(function(dd,i){var n=i+1,slot=String(n),d=odoc(k,slot),o=d?(d.outcome||''):((t.calls&&t.calls[slot])||'');
    out.push({kind:'call',n:n,slot:slot,day:dd,due:dueOn(day0,dd),done:!!o,outcome:o,at:d&&d.at})});
  D.cfg.email.slice(1).forEach(function(dd,i){var n=i+2,slot='email-'+n,o=outcome(k,slot);
    out.push({kind:'email',n:n,slot:slot,day:dd,due:dueOn(day0,dd),done:t.sent.length>=n||!!o,sentOn:t.sent[n-1]?localDay(t.sent[n-1]):'',outcome:o})});
  return out.sort(function(a,b){return a.due<b.due?-1:(a.due>b.due?1:(a.kind==='call'?-1:1))});
}
function active(t,p){var st=statusOf(p,S.T).name;return !(t.replied||t.bounced||t.opted||t.ended||STOPS[st])}
function nextStep(t){var p=byEmail[t.email]||{key:t.key};if(!active(t,p))return null;return stepsOf(t).filter(function(x){return !x.done})[0]||null}
function stepName(s){return s.slot==='cb'?'Call back':(s.kind==='call'?'Call ':'Email ')+s.n}
function statusOf(p,T){
  var d=doc(p.key); if(d&&d.status) return {name:d.status,auto:false};
  if(p.hstatus) return {name:p.hstatus,auto:false};
  var t=p.email&&T[p.email];
  if(t){ if(t.bounced) return {name:D.ui.n.s_bad,auto:true}; if(t.replied) return {name:D.ui.n.s_replied,auto:true}; if(t.sent.length) return {name:D.ui.n.s_emailing,auto:true}; }
  return {name:D.ui.n.s_new,auto:true};
}
function notesOf(p){var d=doc(p.key);return d&&d.notes!=null?d.notes:(p.hnotes||'')}
function tone(name){if(DERIVED[name])return DERIVED[name];var s=STATUS[name];if(!s)return 'mute';if(name===D.ui.n.s_hot)return 'warn';return s.tone}
function pill(st){return '<span class="pill '+(st.auto?'auto':tone(st.name))+'">'+esc(st.name)+'</span>'}
function statusSelect(id,cur){
  var g={},h='<select id="'+id+'" aria-label="Status"><option value="">Pick a status…</option>';
  D.statuses.forEach(function(s){(g[s.group]=g[s.group]||[]).push(s)});
  Object.keys(g).forEach(function(k){h+='<optgroup label="'+esc(k)+'">'+g[k].map(function(s){return '<option value="'+esc(s.name)+'"'+(s.name===cur?' selected':'')+' title="'+esc(s.meaning)+'">'+esc(s.name)+'</option>'}).join('')+'</optgroup>'});
  return h+'</select>';
}


function cardFor(t,kind,extra,logged){
  var p=byEmail[t.email]||byKey[t.key]||{key:t.key,firm:t.firm},k=p.key,slot=extra.slot,cur=outcome(k,slot);
  var opts=D.outcomes[kind].map(function(o){return '<option value="'+esc(o)+'"'+(cur===o?' selected':'')+'>'+esc(o)+'</option>'}).join('');
  var st=statusOf(p,S.T),nx=nextStep(t),od=odoc(k,slot);
  var meta=esc(t.seat||'-')+(t.posted?' · posted '+fmt(t.posted):'')+(t.sent.length?' · emailed '+fmt(localDay(t.sent[0])):'')+(t.variant?' · '+esc(t.variant):'')+(t.kind==='post-call'?' · post-call':'');
  var next=nx?'<div class="meta" style="margin-top:4px">Next: <b style="color:var(--ink)">'+stepName(nx)+'</b> · '+fmtLong(nx.due)+(nx.kind==='call'&&t.phone?' · '+esc(t.phone):'')+'</div>':'';
  var mid='';
  if(kind==='call') mid=(t.phone?'<div class="big"><a href="tel:'+esc(String(t.phone).replace(/[^0-9+]/g,''))+'">'+esc(t.phone)+'</a></div>':'<div class="big">no phone on file</div>')+'<div class="meta">'+(slot==='cb'?'Call back'+(extra.cb?' set for '+fmtLong(extra.cb):''):'Call '+extra.n+' · day '+extra.day+' · due '+fmt(extra.due))+(extra.due<TODAY&&!logged?' <span class="pill warn">overdue</span>':'')+'</div>'+
    (extra.cb&&slot!=='cb'?'<div class="meta">Call back set for '+fmtLong(extra.cb)+(extra.cb<TODAY&&!logged?' <span class="pill warn">overdue</span>':'')+'</div>':'')+
    (logged&&od?'<div class="meta">Logged '+new Date(od.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'. Change it here any time.</div>':'');
  if(kind==='email') mid='<div class="meta">Email '+extra.n+' · day '+extra.day+' · due '+fmt(extra.due)+'</div>'+(t.draft?'<span class="pill good">In Gmail Drafts</span>':(cbWait(t)||'<span class="pill warn">Not drafted yet</span>'));
  if(kind==='reply') mid='<div class="meta">'+esc(t.replyFrom||t.email)+' · '+fmt(localDay(t.replied))+'</div><div class="meta" style="margin-top:6px;color:var(--ink)">'+esc((t.replyText||'Reply in the mailbox.').slice(0,240))+'</div>';
  if(kind==='draft') mid='<div class="meta">'+esc(t.email)+'</div><span class="pill good">In Gmail Drafts</span>';
  var mail=t.body?'<details class="mail"><summary>'+(t.sent.length?'Email that went out':'The draft')+'</summary><pre>'+esc(t.subject)+'\n\n'+esc(t.body)+'</pre></details>':'';
  return '<div class="card"><div><div class="who">'+esc(t.to||'-')+' · '+esc(t.firm)+' '+pill(st)+'</div><div class="meta">'+meta+'</div>'+(t.auto?'<div class="meta" style="margin-top:4px">'+esc(t.auto.slice(0,200))+'</div>':'')+next+mail+'</div>'+
    '<div>'+mid+'</div>'+controls(k,slot,kind,t,p,logged)+'</div>';
}

function controls(k,slot,kind,t,p,logged){
  
  var pk=oid(k,slot)+(logged?'~log':''),pend=S.pending[pk],o0=slot==='cb'&&!logged?'':outcome(k,slot),ov=pend?pend.outcome:o0,nv=pend&&pend.notes!=null?pend.notes:notesOf(p);
  var cbk=(kind==='call'||kind==='reply')&&!(t&&t.opted)&&statusOf(p,S.T||{}).name!==D.ui.n.s_dnc,cb0=cbk?((cbOpen(p,t)||{}).date||''):'',cv=pend&&pend.callback!=null?pend.callback:cb0;
  var opts=D.outcomes[kind].map(function(o){return '<option value="'+esc(o)+'"'+(ov===o?' selected':'')+'>'+esc(o)+'</option>'}).join('');
  return '<div class="ctl" data-card="'+esc(pk)+'"><select data-key="'+esc(k)+'" data-slot="'+esc(slot)+'" data-email="'+esc(t.email)+'"'+(slot==='cb'?' data-o0="'+esc(o0)+'"':'')+' id="oc-'+esc(pk)+'" aria-label="Outcome"><option value="">Outcome…</option>'+opts+'</select>'+
    '<textarea data-notes="'+esc(k)+'" id="tn-'+esc(pk)+'" placeholder="Notes for '+esc(t.firm)+'">'+esc(nv)+'</textarea>'+
    (cbk?'<div class="cbrow"><label for="cb-'+esc(pk)+'">Call back on</label><input type="date" data-cb="'+esc(k)+'" data-cb0="'+esc(cb0)+'" id="cb-'+esc(pk)+'" value="'+esc(cv)+'"><button class="btn cbclear" type="button">Clear</button></div>':'')+
    '<div class="savebar"><button class="btn primary save" type="button"'+(pend?'':' disabled')+'>Save</button><span class="saved" style="color:var(--warn)">'+(pend?'Unsaved changes':'')+'</span></div></div>';
}
function renderToday(){
  var T=S.T,calls=[],fus=[],reps=[],drafts=[],logged=[],soon=[],sentToday=0,horizon=addBiz(5);
  
  function cbPush(t,cb,pc){
    if(!cb)return;
    if(cb.date<=TODAY){if(pc)pc.cb=cb.date;else calls.push(cardFor(t,'call',{kind:'call',slot:'cb',n:'back',day:'',due:cb.date,cb:cb.date}))}
    else if(cb.date<=horizon)soon.push({t:t,s:{kind:'call',slot:'cb',n:'back',day:'',due:cb.date,cb:cb.date}});
  }
  Object.keys(T).forEach(function(a){
    var t=T[a],p=byEmail[a]||{key:t.key},cb=cbOpen(p,t);
    t.sent.forEach(function(ts){if(localDay(ts)===TODAY)sentToday++});
    if(!t.sent.length){if(t.draft||(!S.live&&t.drafted))drafts.push(cardFor(t,'draft',{slot:'draft'}));cbPush(t,cb);return}
    if(t.replied&&!outcome(p.key,'reply')) reps.push(cardFor(t,'reply',{slot:'reply'}));
    if(!active(t,p)){cbPush(t,cb);return}
    var st=stepsOf(t);
    var pc=st.filter(function(x){return x.kind==='call'&&!x.done&&x.due<=TODAY})[0];
    cbPush(t,cb,pc);
    if(pc)calls.push(cardFor(t,'call',pc));
    var ne=st.filter(function(x){return x.kind==='email'&&!x.done})[0];
    if(ne&&ne.due<=TODAY)fus.push(cardFor(t,'email',ne));
    st.filter(function(x){return !x.done&&x.due>TODAY&&x.due<=horizon}).forEach(function(x){soon.push({t:t,s:x})});
  });
  var cbSeen={};D.pipeline.forEach(function(p){if(cbSeen[p.key]||(p.email&&T[p.email]))return;cbSeen[p.key]=1;cbPush(stub(p),cbOpen(p,null))});   
  
  Object.keys(S.docs.outcomes).forEach(function(id){
    var d=S.docs.outcomes[id];if(!d||!d.outcome||!d.at||localDay(d.at)!==TODAY)return;
    var slot=String(d.slot),t=T[(d.email||'').toLowerCase()]||(slot==='cb'&&byKey[d.key]?stub(byKey[d.key]):null);if(!t)return;
    var kind=/^\d+$/.test(slot)||slot==='cb'?'call':(slot==='reply'?'reply':(slot==='draft'?'draft':'email'));
    var cbd=slot==='cb'?((cbOf(byKey[d.key]||{key:d.key})||{}).date||''):'';
    var s=stepsOf(t).filter(function(x){return x.slot===slot})[0]||(slot==='cb'?{kind:'call',slot:'cb',n:'back',day:'',due:cbd,cb:cbd}:{slot:slot,n:slot,day:'',due:''});
    logged.push({at:d.at,html:cardFor(t,kind,s,true)});
  });
  logged.sort(function(a,b){return a.at<b.at?1:-1});
  soon.sort(function(a,b){return a.s.due<b.s.due?-1:(a.s.due>b.s.due?1:0)});
  var cap=capToday();
  $('#t-date').textContent='Today · '+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  function sec(id,title,items,none){return '<h2 id="'+id+'">'+title+' <span class="n">'+items.length+'</span></h2><div class="cards">'+(items.length?items.join(''):'<div class="empty">'+none+'</div>')+'</div>'}
  $('#t-sum').innerHTML=[['#s-calls','Calls due',calls.length],['#s-fu','Follow-up emails due',fus.length],['#s-rep','Replies waiting',reps.length],['#s-new','New emails to send',drafts.length],['#s-log','Logged today',logged.length]].map(function(x){return '<a href="'+x[0]+'"><div class="tk">'+x[1]+'</div><div class="tv">'+x[2]+'</div></a>'}).join('')+
    '<a href="#s-new"><div class="tk">Sent today</div><div class="tv">'+sentToday+' <span class="muted" style="font-size:.9rem">of '+cap+'</span></div><div class="ts '+(sentToday>=cap?'good':'warn')+'">'+(S.live?'live from the mailbox':'as of the last build')+'</div></a>';
  var soonRows=soon.map(function(x){var t=x.t;return '<div class="soon"><span class="sd">'+fmtLong(x.s.due)+'</span><span><span class="dotc '+(x.s.kind==='call'?'warn':'info')+'"></span> '+stepName(x.s)+'</span><span class="sf">'+esc(t.to||'-')+' · '+esc(t.firm)+'</span><span class="muted">'+(x.s.kind==='call'?esc(t.phone||''):'drafts that morning')+'</span></div>'});
  $('#t-body').innerHTML=sec('s-calls','Calls due',calls,D.ui.n.l_nocalls)+
    sec('s-fu','Follow-up emails due',fus,'No follow-ups due. Run Email Drafts when one shows here.')+
    sec('s-rep','Replies waiting',reps,'No replies waiting. A reply lands here within a refresh.')+
    sec('s-new','New emails to send today',drafts,'Nothing in Gmail Drafts. Run Email Drafts to make today’s.')+
    sec('s-log','Logged today',logged.map(function(x){return x.html}),'Nothing logged yet today. Anything you log stays here, and you can change it.')+
    '<h2 id="s-soon">Coming up, next 5 business days <span class="n">'+soon.length+'</span></h2><div class="panel">'+(soonRows.length?soonRows.join(''):'<div class="muted">Nothing scheduled.</div>')+'</div>';
  bindCards($('#t-body'));
}


function renderPipeline(){
  var T=S.T,q=($('#pq').value||'').toLowerCase(),sf=$('#pst').value,counts={},rows=[];
  var list=D.pipeline.map(function(p){var st=statusOf(p,T);counts[st.name]=(counts[st.name]||0)+1;

  var order=D.ui.order;

    rows.push('<div class="prow pgrid" tabindex="0" role="button" data-key="'+esc(p.key)+'" aria-label="Open '+esc(p.firm)+'">'+
      '<div><div class="pf">'+esc(p.firm)+'</div><div class="ps">'+esc([p.partner,p.phone].filter(Boolean).join(' · '))+'</div></div>'+
      '<div class="pc c-city">'+esc(p.city)+(p.state?', '+esc(p.state):'')+'</div><div class="pc c-law">'+esc(p.law||'-')+'</div>'+
      '<div class="c-why"><div class="pc" style="color:var(--ink)">'+esc(p.seat||'-')+'</div><div class="ps"><span class="dotc '+fitTone+'"></span> '+esc(p.fit)+' · '+esc(p.size||'?')+' att'+(p.posted?' · posted '+fmt(p.posted):'')+'</div></div>'+
      '<div class="pc c-post">'+(p.post_url?'<a href="'+esc(p.post_url)+'" target="_blank" rel="noopener" data-stop="1">Posting ↗</a>':'-')+'</div>'+
      '<div>'+pill(x.st)+(n?'<div class="pnote">'+esc(n)+'</div>':'')+'</div></div>');
  });
  $('#plist').innerHTML=rows.length?rows.join(''):'<div class="empty">No firms match.</div>';
  var opts='<option value="">Every status</option>'+order.filter(function(s){return counts[s]}).map(function(s){return '<option value="'+esc(s)+'"'+(s===sf?' selected':'')+'>'+esc(s)+' · '+counts[s]+'</option>'}).join('');
  $('#pst').innerHTML=opts;
  $('#pcounts').innerHTML=order.filter(function(s){return counts[s]}).map(function(s){return pill({name:s,auto:!!DERIVED[s]})+' <b style="font-family:var(--display);margin-right:10px">'+counts[s]+'</b>'}).join('');
}
function openDrawer(key){
  var p=byKey[key];if(!p)return;S.drawer=key;var T=S.T,t=p.email&&T[p.email],st=statusOf(p,T);
  var h=[],touches='',rows=[],cbs=cbState(p,t||null),cb0=cbs&&!cbs.why?cbs.date:'';

  return 'The link did not sign you in ('+(c||dec((d?d[1]:'').replace(/\+/g,' ')))+'). Ask for a new one.'}
function clearHash(){if(location.hash){try{history.replaceState(null,'',location.pathname+location.search)}catch(x){location.hash=''}}}
function safeHref(u){u=String(u||'');return /^https?:\/\//i.test(u)?u:''}   /* F.3: a scraped href is kept only when it is http(s) */
/* ---- records: rows <-> the page's documents (NULL = the field is absent; extra holds any key the columns do not) ---- */
function docOf(r,cols){var d={},x=r.extra,k;cols.forEach(function(c){if(r[c]!=null)d[c]=r[c]});if(x&&typeof x==='object'){for(k in x){if(cols.indexOf(k)<0)d[k]=x[k]}}return d}
function snap(coll,rows){var cols=coll==='pipeline'?REC:OUT,idc=coll==='pipeline'?'key':'id';
  return {docs:rows.map(function(r){return {id:r[idc],data:function(){return docOf(r,cols)}}})}}
function deliver(coll,rows){var s=snap(coll,rows);subs[coll].forEach(function(fn){fn(s)})}
function all(table,order){var out=[];   /* the data API returns at most 1000 rows a request: page through */
  function page(from){return sb.from(table).select('*').order(order).range(from,from+999).then(function(r){
    if(r.error)throw r.error;out=out.concat(r.data||[]);return (r.data||[]).length===1000?page(from+1000):out})}
  return page(0)}
var saves=0;   /* successful set() calls; a re-read that began before a save may hold rows older than it, so it never delivers over it */
function reread(){var at=saves;return Promise.all([all('desk_records','key'),all('desk_outcomes','id')]).then(function(r){
  if(saves!==at)return reread();   /* a save finished while this read was in flight: drop these rows and read again */
  loaded.pipeline=true;deliver('pipeline',r[0]);loaded.outcomes=true;deliver('outcomes',r[1])})}
function saveErr(r){var c=(r&&r.error&&r.error.code)||'',s=r&&r.status;
  return {code:c==='42501'?'no permission':((c==='PGRST301'||s===401)?'signed out':(s?(c||String(s)):'offline'))}}
var DB={
  collection:function(name){return {onSnapshot:function(fn,err){
    if(!subs[name])return function(){};
    subs[name].push(fn);
    if(name==='events'){fn({docs:(DATA.events_docs||[]).map(function(d){return {id:d.id,data:function(){return d}}})});return function(){}}
    all(name==='pipeline'?'desk_records':'desk_outcomes',name==='pipeline'?'key':'id').then(function(rows){loaded[name]=true;fn(snap(name,rows))},function(e){if(err)err(e)});
    return function(){}}}},
  doc:function(path){var i=path.indexOf('/'),coll=path.slice(0,i),id=path.slice(i+1);return {set:function(obj){
    var cols=coll==='pipeline'?REC:(coll==='outcomes'?OUT:null),row={},extra={},k;
    if(!cols)return Promise.reject({code:'read only'});
    if(!loaded.pipeline||!loaded.outcomes){toast('The records did not load. Press Refresh.');return Promise.reject({code:'not loaded'})}   /* F.1 */
    for(k in obj){if(cols.indexOf(k)<0)extra[k]=obj[k]}   /* amendment E: a key without a column goes to extra, never dropped */
    cols.forEach(function(c){row[c]=obj[c]==null?null:String(obj[c])});   /* a full replace, as .set() is on the Claude page */
    row.extra=extra;
    if(coll==='pipeline'){if(row.key!==id)return Promise.reject({code:'key mismatch'});row.updated_by=ME}
    else{if(id!==row.key+'~'+row.slot)return Promise.reject({code:'id mismatch'});row.id=id;row.edited_by=ME}
    return sb.from(coll==='pipeline'?'desk_records':'desk_outcomes').upsert(row,{onConflict:coll==='pipeline'?'key':'id'})
      .then(function(r){if(r.error)throw saveErr(r);saves++},function(){throw {code:'offline'}})}}}};
/* ---- live: realtime for the two tables, and a re-read whenever the tab comes back (F.2) ---- */
var back=null;
function again(){if(!back)back=reread().catch(function(){}).then(function(){back=null})}
function live(){
  sb.channel('desk-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'desk_records'},function(p){if(p.new&&p.new.key)deliver('pipeline',[p.new])})
    .on('postgres_changes',{event:'*',schema:'public',table:'desk_outcomes'},function(p){if(p.new&&p.new.id)deliver('outcomes',[p.new])})
    .subscribe(function(s){if(s==='SUBSCRIBED')again()});
  window.addEventListener('online',again);
  window.addEventListener('focus',again);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)again()});
}
function unsaved(){return !!document.querySelector('.ctl .btn.save:not([disabled]), #dsave:not([disabled])')}
function refresh(){var b=q('#refresh');b.disabled=true;
  Promise.all([reread(),sb.from('desk_page').select('built_at').eq('id','current').maybeSingle()]).then(function(r){
    b.disabled=false;var p=r[1];
    if(p&&p.data&&p.data.built_at!==BUILT){if(unsaved()){toast('A newer build is in. Save or clear your changes, then press Refresh again.');return}location.reload();return}
    toast('Reloaded.')},
  function(){b.disabled=false;toast('Could not reach the data. Check the connection and press Refresh again.')})}
/* ---- sign-in ---- */
function signOut(){sb.auth.signOut({scope:'local'}).then(function(){location.reload()},function(){location.reload()})}   /* local: the other device stays signed in */
function signedIn(session){
  ME=String((session&&session.user&&session.user.email)||'').toLowerCase();
  step('out');stat('');msg('Signed in as '+ME+'. Loading…');
  sb.from('desk_members').select('email').eq('email',ME).maybeSingle().then(function(r){
    if(r.error)throw r.error;
    if(!r.data){msg('Signed in as '+ME+'. Waiting for Hayden to approve this address.');return}
    return sb.from('desk_page').select('data,built_at').eq('id','current').maybeSingle().then(function(p){
      if(p.error)throw p.error;
      if(!p.data){msg('Signed in as '+ME+'. No data has been pushed yet.');return}
      DATA=p.data.data;BUILT=p.data.built_at;REC=DATA.cols.pipeline;OUT=DATA.cols.outcomes;
      (DATA.D.pipeline||[]).forEach(function(x){x.website=safeHref(x.website);x.post_url=safeHref(x.post_url)});
      (DATA.D.events||[]).forEach(function(x){x.page=safeHref(x.page);x.register=safeHref(x.register)});
      q('main').innerHTML=DATA.main_html;
      q('.tabs').hidden=false;q('#live').hidden=false;q('#signout').onclick=signOut;
      window.__ORDER_D=Object.assign({},DATA.D,{ui:DATA.ui});
      window.__ORDER_DB=DB;window.__orderRefresh=refresh;
      window.__orderStart();
      var au=sb.realtime.setAuth(session.access_token);if(au&&au.catch)au.catch(function(){});   /* so the first phx_join carries the member's token, not the publishable key */
      live();
    });
  }).catch(function(){var t='Signed in as '+ME+'. The data did not load. Refresh the page to try again.';msg(t);toast(t)});   /* F.5 */
}
q('#si-signout').onclick=signOut;
q('#si-email-form').onsubmit=function(e){e.preventDefault();
  var em=q('#si-email').value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){stat('That does not look like an email address.',true);return}
  stat('Sending the link…');
  sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true,emailRedirectTo:CFG.redirect}}).then(function(r){
    if(r.error)throw r.error;step('sent');stat('');msg(SENT)
  }).catch(function(x){stat(why(x),true)})};
q('#si-back').onclick=function(){step('email');msg(ASK);stat('');q('#si-email').focus()};
var herr=hashError();
sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;clearHash();if(s)signedIn(s);else{step('email');if(herr)stat(herr,true)}},function(){clearHash();step('email')});
})();
</script>
