<style>
:root{color-scheme:light;
--bg:#ffffff;--tint:#f5f4f0;--card:#ffffff;--line:#e4e6ec;--line2:#d3d6de;
--ink:#0e0f12;--ink2:#3d4150;--mute:#5f6475;--dim:#b4b8c2;
--accent:#2d6cdf;--accent-soft:#e8effc;--good:#15733e;--warn:#8a5300;--bad:#b42318;--info-ink:#1f54b8;
--win:#0e0f12;--win2:#16181d;--win2-hover:#1c1f26;--dark-line:#262930;--on-dark:#ececef;--on-dark-mute:#b9bcc4;--nav-bg:#ffffffdb;--ink-hover:#24272f;--good-soft:#e6f5ec;--dot-good:#7ed3a0;--dot-wait:#8ab4f8;--dot-act:#f0b35a;
--display:"Space Grotesk","Plus Jakarta Sans",system-ui,sans-serif;--body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
--r:16px;--r2:10px;--max:1120px}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--nav-h,80px) + 10px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
/* nav, as the site's */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--nav-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nav-in{max-width:var(--max);margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.wordmark{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:-.03em;color:var(--ink)}.wordmark b{color:var(--accent)}.wordmark:hover{text-decoration:none}
.tabs{display:flex;align-items:center;gap:22px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--ink2);padding:6px 0;font-weight:500;font-size:.95rem;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;border-radius:0}
.tab:hover{color:var(--ink)}.tab[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.live{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--mute);white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}.live.on .dot{background:var(--good)}.live.warn .dot{background:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:600;font-size:.9rem;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:transform .15s ease,background .15s ease,border-color .15s ease;white-space:nowrap}
.btn:hover{border-color:var(--ink);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:default;transform:none;border-color:var(--line)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.primary:hover{background:var(--ink-hover)}.btn.primary:disabled{background:var(--tint);color:var(--mute);border-color:var(--line)}
main{max-width:var(--max);margin:0 auto;padding:40px 20px 96px}
.view[hidden]{display:none}
.eyebrow{font-family:var(--display);font-size:.8rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}

h2 .n{font-family:var(--display);color:var(--mute);font-weight:500;font-size:.9rem}
h3{font-family:var(--display);font-weight:600;font-size:1.15rem;letter-spacing:-.02em;margin:0 0 .4em}
.lead{color:var(--ink2);font-size:1.05rem;max-width:46rem;margin:0}
.muted{color:var(--mute)}.small{font-size:.85rem}
.head{max-width:46rem;margin-bottom:32px}
/* cards, as the site's */
.card,.panel,.empty,.prow,.ev,.banner,.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.panel{padding:24px;margin-bottom:16px}
.ph{font-family:var(--display);font-weight:600;font-size:1.02rem;margin-bottom:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.scroll{overflow-x:auto}

td{padding:10px 12px 10px 0;border-bottom:1px dashed var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--display);white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink2)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.pill.info i{background:var(--accent)}.pill.warn i{background:var(--warn)}.pill.good i{background:var(--good)}.pill.bad i{background:var(--bad)}.pill.mute i{background:var(--dim)}
.pill.auto{border-style:dashed;color:var(--mute)}.pill.auto i{background:var(--dim)}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}.dotc.good{background:var(--good)}.dotc.warn{background:var(--warn)}.dotc.info{background:var(--accent)}.dotc.bad{background:var(--bad)}
select,input[type=search],input[type=date],input[type=email],input[type=text],textarea{background:var(--card);border:1px solid var(--line2);border-radius:var(--r2);padding:10px 12px;font-size:.92rem;color:var(--ink)}
select{cursor:pointer}textarea{width:100%;min-height:72px;resize:vertical;line-height:1.5}
.cbrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--ink2)}.cbrow input{flex:1;min-width:140px}.cbrow input[type=date]{font-family:var(--display)}.cbrow .btn{padding:7px 12px;font-size:.82rem}

.win-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.win-tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.win-tiles a,.tile{background:var(--win2);border-radius:12px;padding:12px 14px;display:grid;gap:2px;color:var(--on-dark);text-decoration:none}.win-tiles a:hover{background:var(--win2-hover);text-decoration:none}
.tk{font-size:.8rem;color:var(--on-dark-mute)}.tv{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:-.02em;line-height:1.1}.tv .muted{color:var(--on-dark-mute);font-size:.95rem;font-weight:500}
.ts{font-size:.74rem;color:var(--on-dark-mute)}.ts.good{color:var(--dot-good)}.ts.warn{color:var(--dot-act)}
.win-rows{margin-top:12px;display:grid;gap:6px}
.wrow{display:grid;grid-template-columns:12px 1.4fr 1fr auto;align-items:center;gap:10px;background:var(--win2);border-radius:10px;padding:9px 12px;font-size:.85rem;color:var(--on-dark);text-align:left;border:0;cursor:pointer;width:100%}
.wrow:hover{background:var(--win2-hover)}.wrow span:nth-child(3){color:var(--on-dark-mute)}.wrow b{font-family:var(--display)}
.wdot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--dot-wait)}.wdot.act{background:var(--dot-act)}.wdot.done{background:var(--dot-good)}
.win .spark{height:96px;border-bottom:1px solid var(--dark-line)}.win .spark i{background:linear-gradient(180deg,#8ab4f8,#2d6cdf)}.win .spark .cap{border-top-color:#f0b35acc}.win .axis{color:var(--on-dark-mute)}.win .ph{color:var(--on-dark)}.win .ph .muted{color:var(--on-dark-mute)}
/* Today */
.sum{margin:0 0 6px}
.cards{display:grid;gap:12px}
.card{padding:22px 24px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr) minmax(260px,1fr);gap:12px 28px;align-items:start}
.card .who{font-family:var(--display);font-weight:600;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .meta{color:var(--ink2);font-size:.88rem;margin-top:4px}
.card .big{font-family:var(--display);font-weight:700;font-size:1.45rem;letter-spacing:-.02em;user-select:all}.card .big a{color:var(--ink)}
.card .ctl{display:grid;gap:10px}.card .ctl select{width:100%}
.saved{font-size:.78rem;color:var(--good);min-height:1em}
details.mail summary{cursor:pointer;color:var(--accent);font-size:.85rem;font-weight:600;list-style:none;margin-top:8px}details.mail summary::-webkit-details-marker{display:none}
details.mail pre{white-space:pre-wrap;font:inherit;font-size:.86rem;color:var(--ink2);background:var(--tint);border-radius:var(--r2);padding:14px;margin:8px 0 0;max-width:66ch}
.empty{padding:20px 24px;color:var(--mute);font-size:.92rem}
.banner{padding:14px 18px;margin:0 0 16px;font-size:.9rem;color:var(--ink2);background:var(--tint)}.banner b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips .oc{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:7px 12px;font-size:.84rem;font-weight:600;cursor:pointer;transition:border-color .15s ease}
.chips .oc:hover{border-color:var(--ink);color:var(--ink)}.chips .oc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chips .oc:disabled{opacity:.5;cursor:default;border-color:var(--line)}
.one{display:grid;gap:12px}
.onebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--ink2)}.onebar .n{font-family:var(--display);font-weight:600;color:var(--ink)}
.onebar .sp{flex:1}.onebar .zone{color:var(--mute)}
.queue{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;align-items:center}.queue button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:.78rem;color:var(--ink2);cursor:pointer}.queue button:hover{border-color:var(--ink);color:var(--ink)}
/* Pipeline */
.toolbar{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin:0 0 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--nav-h,62px));z-index:20;background:var(--bg);padding:8px 0}
.seg{display:flex;flex-wrap:wrap;gap:2px 18px;align-items:center}
.seg button{border:0;background:none;color:var(--ink2);padding:6px 0;border-bottom:2px solid transparent;border-radius:0;font-weight:500;font-size:.92rem;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}.seg button[aria-pressed=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}.seg button span{color:var(--mute);font-weight:500;margin-left:4px}
.toolbar input[type=search]{flex:1;min-width:200px;border-radius:10px;padding:9px 14px}.toolbar select{border-radius:10px;padding:9px 12px}
.plist{overflow-x:auto}
.pgrid{display:grid;grid-template-columns:minmax(200px,1.5fr) 118px minmax(120px,.85fr) minmax(210px,1.45fr) 64px minmax(210px,1.25fr);gap:0 16px;align-items:center}
.phead{font-family:var(--display);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:0 18px 10px;min-width:980px}
.prow{border-radius:12px;padding:14px 18px;margin-bottom:8px;cursor:pointer;min-width:980px}
.prow:hover{border-color:var(--ink)}.prow:focus-visible{outline:2px solid var(--accent)}
.pf{font-weight:600}.ps{color:var(--mute);font-size:.82rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{font-size:.88rem;color:var(--ink2)}
.pnote{color:var(--ink2);font-size:.82rem;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.counts{display:flex;flex-wrap:wrap;gap:8px}
/* Drawer */
.scrim{position:fixed;inset:0;background:#0e0f1266;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);border-left:1px solid var(--line);z-index:41;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 24px calc(env(safe-area-inset-bottom,0px) + 40px);box-shadow:-30px 0 60px #0e0f1222}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.dh h3{font-size:1.4rem;margin:0}
.dsec{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}.dsec .lab{font-family:var(--display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:.9rem}.kv span:nth-child(odd){color:var(--mute)}.sel{user-select:all}
.hist{display:grid;gap:6px}.hist div{display:flex;gap:10px;font-size:.88rem}.hist time{color:var(--mute);min-width:64px;font-family:var(--display)}
.copy{border:0;background:none;color:var(--accent);cursor:pointer;font-size:.8rem;padding:0 0 0 6px}
.callbtn{margin:10px 0 2px;text-decoration:none!important;gap:10px;max-width:100%;overflow:hidden}.callbtn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.callbtn svg{width:18px;height:18px;flex:none}
.savebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.savebar .saved{min-height:0}
.dbar{position:sticky;bottom:calc(-40px - env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);margin:18px -24px 0;padding:12px 24px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:12px}
.touches{display:grid;gap:6px}.touch{display:grid;grid-template-columns:78px minmax(0,1fr) 190px;gap:10px;align-items:center;font-size:.88rem;background:var(--tint);border-radius:10px;padding:9px 12px}
.touch b{font-family:var(--display);font-weight:600}.touch select{width:100%}
.soon{display:grid;grid-template-columns:120px 90px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:.9rem;padding:9px 0;border-bottom:1px dashed var(--line)}.soon:last-child{border-bottom:0}
.soon .sd{font-family:var(--display);color:var(--ink2)}.soon .sf{font-weight:600}

.month{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:26px 0 12px;color:var(--ink2)}
.ev{padding:16px 20px;margin-bottom:8px;display:grid;grid-template-columns:62px minmax(0,1.6fr) minmax(170px,.9fr) 150px 120px;gap:14px;align-items:start}
.leaf{text-align:center;background:var(--tint);border-radius:10px;padding:6px 0}.leaf b{display:block;font-family:var(--display);font-size:1.35rem;line-height:1.1}.leaf span{font-size:.7rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.ev .t{font-weight:600}.ev .m{color:var(--ink2);font-size:.85rem;margin-top:2px}.ev .w{color:var(--mute);font-size:.82rem;margin-top:6px;max-width:70ch}
.links{display:grid;gap:4px;font-size:.86rem}
.fitbar{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:.85rem}.fitbar .bar{width:70px}
.cal{padding:20px 22px;margin-bottom:14px}
.cal .ch{font-family:var(--display);font-weight:600;font-size:1.05rem;margin-bottom:12px}
.cal .dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-family:var(--display);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:0 0 6px}
.cal .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .d{min-width:0;min-height:78px;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:.78rem;background:var(--card)}.cal .d.has{cursor:pointer}.cal .d.has:hover{border-color:var(--ink)}.cal .d.pad{background:var(--tint);border-color:transparent}.cal .d.today{border-color:var(--ink)}
.cal .d .dn{font-family:var(--display);color:var(--mute);font-size:.72rem}.cal .d.today .dn{color:var(--ink);font-weight:700}
.cal .chip{display:block;width:100%;text-align:left;border:0;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:2px 6px;margin-top:3px;font-size:.72rem;line-height:1.3;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .chip.going{background:var(--good-soft)}.cal .chip.skip{background:var(--tint);color:var(--mute)}.cal .chip:hover{outline:1px solid var(--accent)}
.ev.hl{border-color:var(--ink)}
/* KPIs */
.bar{height:6px;background:var(--tint);border-radius:999px;display:inline-block;overflow:hidden;vertical-align:middle;width:100%}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2d6cdf,#8ab4f8);border-radius:999px}
.frow{display:grid;grid-template-columns:minmax(170px,1fr) 2fr 56px 56px;gap:12px;align-items:center;font-size:.92rem;padding:9px 0;border-bottom:1px dashed var(--line)}.frow:last-of-type{border-bottom:0}
.frow b{font-family:var(--display);text-align:right}.frow .pc{text-align:right;color:var(--mute);font-family:var(--display)}
.frow.sub{font-size:.85rem;color:var(--ink2);padding:5px 0 5px 18px;border-bottom:0}.frow.sub .bar{height:4px}.frow.sub .bar i{background:linear-gradient(90deg,#c77d13,#f0b35a)}
.spark{display:flex;align-items:flex-end;gap:5px;height:110px;border-bottom:1px solid var(--line);position:relative}.spark i{flex:1;background:linear-gradient(180deg,#8ab4f8,#2d6cdf);border-radius:6px 6px 2px 2px;min-height:2px;position:relative;z-index:1}
.spark .cap{position:absolute;height:0;border-top:2px dashed var(--dot-act);z-index:2;pointer-events:none}
.axis{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mute);margin-top:8px;font-family:var(--display)}
/* Game plan, as the site's numbered cards */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 20px}
.steps .sn{font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--accent);letter-spacing:.06em;display:block;margin-bottom:10px}
.steps b{font-family:var(--display);font-weight:600;font-size:1.05rem;display:block;margin-bottom:4px;color:var(--ink)}.steps span{color:var(--ink2);font-size:.95rem}
.steps .k{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}.steps .k.email{background:var(--accent)}.steps .k.call{background:var(--warn)}

function cbRaw(p){var d=doc(p.key);return d&&d.callback!=null?{date:d.callback||'',at:d.callback_at||(d.callback?d.at:'')||''}:{date:p.hcallback||'',at:p.hcallback_at||''}}
function cbOf(p){var r=cbRaw(p);return /^\d{4}-\d{2}-\d{2}$/.test(r.date)?{date:r.date,at:nz(r.at)}:null}

function cbState(p,t){
  var cb=cbOf(p);if(!cb)return null;
  var o=['1','2','cb'].map(function(s){return odoc(p.key,s)}).filter(function(d){var w=d&&nz(d.edited||d.at);return d&&d.outcome&&w>cb.at&&localDay(w)>=cb.date})[0];
  
  if(!o&&t&&t.calld)o=['1','2'].map(function(s){return t.calls[s]&&t.calld[s]&&t.calld[s]>=cb.date&&t.calld[s]>=localDay(cb.at)?{outcome:t.calls[s]}:null}).filter(Boolean)[0];
  cb.why=(t&&t.opted)||statusOf(p,S.T||{}).name===D.ui.n.s_dnc?D.ui.n.s_dnc.toLowerCase():(t&&t.lastReply&&t.lastReply>cb.at?'they replied '+fmt(localDay(t.lastReply)):(o?'a call was logged ('+o.outcome+')':''));
  return cb;
}

function cbWait(t){var p=byKey[t.key]||byEmail[t.email],c=p&&cbOpen(p,t);return c&&c.date>=TODAY?'<span class="pill"><i></i>Waiting on the call-back '+fmt(c.date)+'</span>':''}
function cbOpen(p,t){var cb=cbState(p,t);return cb&&!cb.why?cb:null}
function cbDue(p,t){var cb=cbOpen(p,t);return cb&&cb.date<=TODAY?cb:null}
function stub(p){return {email:p.email||'',key:p.key,firm:p.firm,to:p.partner||'',phone:p.phone||'',seat:p.seat||'',posted:p.posted||'',age:'',variant:'',kind:'cold',
  sent:[],drafted:false,subject:'',body:'',calls:{},replied:'',lastReply:'',replyText:'',reply:'',opted:false,bounced:false,ended:false,next:'',auto:''}}
function stepsOf(t){
  if(!t.sent.length)return [];
  var p=byEmail[t.email]||{key:t.key},k=p.key,day0=localDay(t.sent[0]),out=[];
  D.cfg.call.forEach(function(dd,i){var n=i+1,slot=String(n),d=odoc(k,slot),o=d?(d.outcome||''):((t.calls&&t.calls[slot])||'');
    out.push({kind:'call',n:n,slot:slot,day:dd,due:dueOn(day0,dd),done:!!o,outcome:o,at:d&&d.at})});
  D.cfg.email.slice(1).forEach(function(dd,i){var n=i+2,slot='email-'+n,o=outcome(k,slot);
    out.push({kind:'email',n:n,slot:slot,day:dd,due:dueOn(day0,dd),done:t.sent.length>=n||!!o,sentOn:t.sent[n-1]?localDay(t.sent[n-1]):'',outcome:o})});
  return out.sort(function(a,b){return a.due<b.due?-1:(a.due>b.due?1:(a.kind==='call'?-1:1))});
}
function active(t,p){var st=statusOf(p,S.T).name;return !(t.replied||t.bounced||t.opted||t.ended||STOPS[st])}
function nextStep(t){var p=byEmail[t.email]||{key:t.key};if(!active(t,p))return null;return stepsOf(t).filter(function(x){return !x.done})[0]||null}
function stepName(s){return s.slot==='cb'?'Call back':(s.kind==='call'?'Call ':'Email ')+s.n}
function statusOf(p,T){
  var d=doc(p.key); if(d&&d.status) return {name:d.status,auto:false};
  if(p.hstatus) return {name:p.hstatus,auto:false};
  var t=p.email&&T[p.email];
  if(t){ if(t.bounced) return {name:D.ui.n.s_bad,auto:true}; if(t.replied) return {name:D.ui.n.s_replied,auto:true}; if(t.sent.length) return {name:D.ui.n.s_emailing,auto:true}; }
  return {name:D.ui.n.s_new,auto:true};
}
function notesOf(p){var d=doc(p.key);return d&&d.notes!=null?d.notes:(p.hnotes||'')}
function tone(name){if(DERIVED[name])return DERIVED[name];var s=STATUS[name];if(!s)return 'mute';if(name===D.ui.n.s_hot)return 'warn';return s.tone}
function pill(st){return '<span class="pill '+(st.auto?'auto':tone(st.name))+'"><i></i>'+esc(st.name)+'</span>'}
function statusSelect(id,cur){
  var g={},h='<select id="'+id+'" aria-label="Status"><option value="">Pick a status…</option>';
  D.statuses.forEach(function(s){(g[s.group]=g[s.group]||[]).push(s)});
  Object.keys(g).forEach(function(k){h+='<optgroup label="'+esc(k)+'">'+g[k].map(function(s){return '<option value="'+esc(s.name)+'"'+(s.name===cur?' selected':'')+' title="'+esc(s.meaning)+'">'+esc(s.name)+'</option>'}).join('')+'</optgroup>'});
  return h+'</select>';
}


function cardFor(t,kind,extra,logged){
  var p=byEmail[t.email]||byKey[t.key]||{key:t.key,firm:t.firm},k=p.key,slot=extra.slot,cur=outcome(k,slot);
  var opts=D.outcomes[kind].map(function(o){return '<option value="'+esc(o)+'"'+(cur===o?' selected':'')+'>'+esc(o)+'</option>'}).join('');
  var st=statusOf(p,S.T),nx=nextStep(t),od=odoc(k,slot);
  var meta=esc(t.seat||'-')+(t.posted?' · posted '+fmt(t.posted):'')+(t.sent.length?' · emailed '+fmt(localDay(t.sent[0])):'')+(t.variant?' · '+esc(t.variant):'')+(t.kind==='post-call'?' · post-call':'');
  var next=nx?'<div class="meta" style="margin-top:4px">Next: <b style="color:var(--ink)">'+stepName(nx)+'</b> · '+fmtLong(nx.due)+(nx.kind==='call'&&t.phone?' · '+esc(t.phone):'')+'</div>':'';
  var mid='';
  if(kind==='call') mid=(t.phone?'<div class="big"><a href="tel:'+esc(String(t.phone).replace(/[^0-9+]/g,''))+'">'+esc(t.phone)+'</a></div>':'<div class="big">no phone on file</div>')+'<div class="meta">'+(slot==='cb'?'Call back'+(extra.cb?' set for '+fmtLong(extra.cb):''):'Call '+extra.n+' · day '+(extra.day+1)+' · due '+fmt(extra.due))+(extra.due<TODAY&&!logged?' <span class="pill warn"><i></i>overdue</span>':'')+'</div>'+
    (extra.cb&&slot!=='cb'?'<div class="meta">Call back set for '+fmtLong(extra.cb)+(extra.cb<TODAY&&!logged?' <span class="pill warn"><i></i>overdue</span>':'')+'</div>':'')+
    (logged&&od?'<div class="meta">Logged '+new Date(od.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'. Change it here any time.</div>':'');
  var tel=t.phone?String(t.phone).replace(/[^0-9+]/g,''):'';
  if(kind==='call'&&tel) mid+='<a class="btn primary callbtn" href="tel:'+esc(tel)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span>Call '+esc(t.to&&t.to!=='-'?t.to:'the office')+'</span></a>';
  if(kind==='email') mid='<div class="meta">Email '+extra.n+' · day '+(extra.day+1)+' · due '+fmt(extra.due)+'</div>'+(t.draft?'<span class="pill good"><i></i>In Gmail Drafts</span>':(cbWait(t)||'<span class="pill warn"><i></i>Not drafted yet</span>'));
  if(kind==='reply') mid='<div class="meta">'+esc(t.replyFrom||t.email)+' · '+fmt(localDay(t.replied))+'</div><div class="meta" style="margin-top:6px;color:var(--ink)">'+esc((t.replyText||'Reply in the mailbox.').slice(0,240))+'</div>';
  if(kind==='draft') mid='<div class="meta">'+esc(t.email)+'</div><span class="pill good"><i></i>In Gmail Drafts</span>';
  var mail=t.body?'<details class="mail"><summary>'+(t.sent.length?'Latest email'+(t.last_sent?', sent '+fmt(t.last_sent):''):'The draft')+'</summary><pre>'+esc(t.subject)+'\n\n'+esc(t.body)+'</pre></details>':'';
  return '<div class="card"><div><div class="who">'+esc(t.to||'-')+' · '+esc(t.firm)+' '+pill(st)+'</div><div class="meta">'+meta+'</div>'+(t.auto?'<div class="meta" style="margin-top:4px">'+esc(t.auto.slice(0,200))+'</div>':'')+next+mail+'</div>'+
    '<div>'+mid+'</div>'+controls(k,slot,kind,t,p,logged)+'</div>';
}

function controls(k,slot,kind,t,p,logged){
  
  var pk=oid(k,slot)+(logged?'~log':''),pend=S.pending[pk],o0=slot==='cb'&&!logged?'':outcome(k,slot),ov=pend?pend.outcome:o0,nv=pend&&pend.notes!=null?pend.notes:notesOf(p);
  var cbk=(kind==='call'||kind==='reply')&&!(t&&t.opted)&&statusOf(p,S.T||{}).name!==D.ui.n.s_dnc,cb0=cbk?((cbOpen(p,t)||{}).date||''):'',cv=pend&&pend.callback!=null?pend.callback:cb0;
  var opts=D.outcomes[kind].map(function(o){return '<option value="'+esc(o)+'"'+(ov===o?' selected':'')+'>'+esc(o)+'</option>'}).join('');
  var chips=kind==='call'?'<div class="chips">'+D.outcomes.call.map(function(o){return '<button type="button" class="oc'+(ov===o?' on':'')+'" data-o="'+esc(o)+'">'+esc(o)+'</button>'}).join('')+'</div>':'';
  return '<div class="ctl" data-card="'+esc(pk)+'">'+chips+'<select data-key="'+esc(k)+'" data-slot="'+esc(slot)+'" data-email="'+esc(t.email)+'"'+(slot==='cb'?' data-o0="'+esc(o0)+'"':'')+' id="oc-'+esc(pk)+'" aria-label="Outcome"><option value="">Outcome…</option>'+opts+'</select>'+
    '<textarea data-notes="'+esc(k)+'" id="tn-'+esc(pk)+'" placeholder="Notes for '+esc(t.firm)+'">'+esc(nv)+'</textarea>'+
    (cbk?'<div class="cbrow"><label for="cb-'+esc(pk)+'">Call back on</label><input type="date" data-cb="'+esc(k)+'" data-cb0="'+esc(cb0)+'" id="cb-'+esc(pk)+'" value="'+esc(cv)+'"><button class="btn cbclear" type="button">Clear</button></div>':'')+
    '<div class="savebar"><button class="btn primary save" type="button"'+(pend?'':' disabled')+'>Save</button><span class="saved" style="color:var(--warn)">'+(pend?'Unsaved changes':'')+'</span></div></div>';
}
function renderToday(){
  var T=S.T,calls=[],fus=[],drafts=[],logged=[],soon=[],sentToday=0,horizon=addBiz(5);
  
  function cbPush(t,cb,pc){
    if(!cb)return;
    if(cb.date<=TODAY){if(pc)pc.cb=cb.date;else calls.push({t:t,s:{kind:'call',slot:'cb',n:'back',day:'',due:cb.date,cb:cb.date}})}
    else if(cb.date<=horizon)soon.push({t:t,s:{kind:'call',slot:'cb',n:'back',day:'',due:cb.date,cb:cb.date}});
  }
  Object.keys(T).forEach(function(a){
    var t=T[a],p=byEmail[a]||{key:t.key},cb=cbOpen(p,t);
    t.sent.forEach(function(ts){if(localDay(ts)===TODAY)sentToday++});
    if(!t.sent.length){if(t.draft||(!S.live&&t.drafted))drafts.push(cardFor(t,'draft',{slot:'draft'}));cbPush(t,cb);return}
    if(!active(t,p)){cbPush(t,cb);return}
    var st=stepsOf(t);
    var pc=st.filter(function(x){return x.kind==='call'&&!x.done&&x.due<=TODAY})[0];
    cbPush(t,cb,pc);
    if(pc)calls.push({t:t,s:pc});
    var ne=st.filter(function(x){return x.kind==='email'&&!x.done})[0];
    if(ne&&ne.due<=TODAY)fus.push(cardFor(t,'email',ne));
    st.filter(function(x){return !x.done&&x.due>TODAY&&x.due<=horizon}).forEach(function(x){soon.push({t:t,s:x})});
  });
  var cbSeen={};D.pipeline.forEach(function(p){if(cbSeen[p.key]||(p.email&&T[p.email]))return;cbSeen[p.key]=1;cbPush(stub(p),cbOpen(p,null))});   
  
  Object.keys(S.docs.outcomes).forEach(function(id){
    var d=S.docs.outcomes[id];if(!d||!d.outcome||!d.at||localDay(d.at)!==TODAY)return;
    var slot=String(d.slot),t=T[(d.email||'').toLowerCase()]||(slot==='cb'&&byKey[d.key]?stub(byKey[d.key]):null);if(!t)return;
    var kind=/^\d+$/.test(slot)||slot==='cb'?'call':(slot==='reply'?'reply':(slot==='draft'?'draft':'email'));
    var cbd=slot==='cb'?((cbOf(byKey[d.key]||{key:d.key})||{}).date||''):'';
    var s=stepsOf(t).filter(function(x){return x.slot===slot})[0]||(slot==='cb'?{kind:'call',slot:'cb',n:'back',day:'',due:cbd,cb:cbd}:{slot:slot,n:slot,day:'',due:''});
    logged.push({at:d.at,html:cardFor(t,kind,s,true)});
  });
  logged.sort(function(a,b){return a.at<b.at?1:-1});
  soon.sort(function(a,b){return a.s.due<b.s.due?-1:(a.s.due>b.s.due?1:0)});
  
  calls.forEach(function(c){var p=byEmail[c.t.email]||byKey[c.t.key]||{};c.z=zoneOf(p.state);c.zn=ZONE_NAME[c.z]||''});
  calls.sort(function(a,b){return a.z-b.z||(a.s.due<b.s.due?-1:(a.s.due>b.s.due?1:0))||String(a.t.firm).localeCompare(String(b.t.firm))});
  var cap=capToday();
  $('#t-date').textContent='Today · '+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  function sec(id,title,items,none){return '<h2 id="'+id+'">'+title+' <span class="n">'+items.length+'</span></h2><div class="cards">'+(items.length?items.join(''):'<div class="empty">'+none+'</div>')+'</div>'}
  var nextRows=calls.slice(0,4).map(function(c,i){return '<button class="wrow" type="button" data-go="'+i+'"><span class="wdot'+(i===S.callIdx?' act':(i<S.callIdx?' done':''))+'"></span><span>'+esc(c.t.firm)+'</span><span>'+esc(stepName(c.s))+' · '+esc(c.zn)+'</span><b>'+esc(c.t.phone||'')+'</b></button>'}).join('');
  $('#t-sum').innerHTML='<div class="win"><div class="win-tiles">'+
    [['#s-calls','Calls due',calls.length,calls.length?'east to west':'none due'],['#s-fu','Follow-up emails due',fus.length,fus.length?'drafts that morning':'none due'],['#s-new','New emails to send',drafts.length,drafts.length?'in Gmail Drafts':'nothing waiting'],['#s-log','Logged today',logged.length,logged.length?'saved':'nothing yet']].map(function(x){return '<a href="'+x[0]+'"><div class="tk">'+x[1]+'</div><div class="tv">'+x[2]+'</div><div class="ts">'+x[3]+'</div></a>'}).join('')+
    '<a href="#s-new"><div class="tk">Sent today</div><div class="tv">'+sentToday+' <span class="muted">of '+cap+'</span></div><div class="ts '+(sentToday>=cap?'good':'')+'">'+'today'+'</div></a></div>'+
    (nextRows?'<div class="win-rows">'+nextRows+'</div>':'')+'</div>';
  var soonRows=soon.map(function(x){var t=x.t;return '<div class="soon"><span class="sd">'+fmtLong(x.s.due)+'</span><span><span class="dotc '+(x.s.kind==='call'?'warn':'info')+'"></span> '+stepName(x.s)+'</span><span class="sf">'+esc(t.to||'-')+' · '+esc(t.firm)+'</span><span class="muted">'+(x.s.kind==='call'?esc(t.phone||''):'drafts that morning')+'</span></div>'});
  
  var callsHtml,held=false;
  if(!calls.length)callsHtml='<div class="cards"><div class="empty">'+D.ui.n.l_nocalls+'</div></div>';
  else if(S.callsList)callsHtml='<div class="onebar"><span class="sp"></span><button class="btn" type="button" id="calls-one">One at a time</button></div><div class="cards">'+calls.map(function(c){return cardFor(c.t,'call',c.s)}).join('')+'</div>';
  else{
    if(S.callIdx>=calls.length)S.callIdx=calls.length-1;if(S.callIdx<0)S.callIdx=0;try{sessionStorage.setItem('order.callIdx',String(S.callIdx))}catch(e){}
    var c=calls[S.callIdx];held=!!S.pending[oid((byEmail[c.t.email]||byKey[c.t.key]||{key:c.t.key}).key,c.s.slot)];
    callsHtml='<div class="one"><div class="onebar"><span class="n">'+(S.callIdx+1)+' of '+calls.length+'</span><span class="zone">'+esc(c.zn)+'</span>'+(held?'<span class="pill warn"><i></i>Save or clear this card to move on</span>':'')+'<span class="sp"></span>'+
      '<button class="btn" type="button" id="calls-prev"'+(S.callIdx&&!held?'':' disabled')+'>Back</button><button class="btn" type="button" id="calls-next"'+(S.callIdx<calls.length-1&&!held?'':' disabled')+'>Next</button><button class="btn" type="button" id="calls-list">Show as a list</button></div>'+
      '<div class="onegrid"><div class="queue ql">'+calls.map(function(x,i){return '<button type="button" data-i="'+i+'"'+(i===S.callIdx?' aria-current="true"':'')+' title="'+esc(x.zn)+'"><b>'+(i<9?'0':'')+(i+1)+'</b><span>'+esc(x.t.firm)+'</span><em>'+esc(stepName(x.s))+'</em></button>'}).join('')+'</div>'+
      '<div class="cards">'+cardFor(c.t,'call',c.s)+'</div></div></div>';
  }
  $('#t-body').innerHTML='<h2 id="s-calls">Calls due <span class="n">'+calls.length+'</span></h2>'+callsHtml+
    sec('s-fu','Follow-up emails due',fus,'No follow-ups due. Run Email Drafts when one shows here.')+
    sec('s-new','New emails to send today',drafts,'Nothing in Gmail Drafts. Run Email Drafts to make today’s.')+
    sec('s-log','Logged today',logged.map(function(x){return x.html}),'Nothing logged yet today. Anything you log stays here, and you can change it.')+
    '<h2 id="s-soon">Coming up, next 5 business days <span class="n">'+soon.length+'</span></h2><div class="panel">'+(soonRows.length?soonRows.join(''):'<div class="muted">Nothing scheduled.</div>')+'</div>';
  var pv=$('#calls-prev'),nx=$('#calls-next'),ls=$('#calls-list'),on=$('#calls-one');
  if(pv)pv.onclick=function(){S.callIdx--;renderToday()};if(nx)nx.onclick=function(){S.callIdx++;renderToday()};
  if(ls)ls.onclick=function(){S.callsList=true;renderToday()};if(on)on.onclick=function(){S.callsList=false;renderToday()};
  $$('.queue button').forEach(function(b){b.onclick=function(){if(held){toast('Save or clear this card to move on');return}var y=window.scrollY,ql=$('.ql'),qs=ql?ql.scrollTop:0;S.callIdx=+b.dataset.i;renderToday();window.scrollTo(0,y);var q2=$('.ql');if(q2)q2.scrollTop=qs}});
  var curC=calls[S.callIdx],heldNow=!!(curC&&S.pending[oid((byEmail[curC.t.email]||byKey[curC.t.key]||{key:curC.t.key}).key,curC.s.slot)]);
  $$('#t-sum .wrow').forEach(function(b){b.onclick=function(){if(heldNow){toast('Save or clear this card to move on');return}S.callsList=false;S.callIdx=+b.dataset.go;renderToday();window.scrollTo(0,$('#s-calls').offsetTop-navH()-8)}});
  bindCards($('#t-body'));
}

  var list=D.pipeline.map(function(p){var st=statusOf(p,T);counts[st.name]=(counts[st.name]||0)+1;
    var yours=!st.auto||(T[p.email]&&T[p.email].sent.length)||!!notesOf(p);
    return {p:p,st:st,tier:yours?0:(p.fit.indexOf('fits')===0?1:2)}});
  var order=D.ui.order;
  list.sort(function(a,b){return a.tier-b.tier||order.indexOf(a.st.name)-order.indexOf(b.st.name)||(b.p.score-a.p.score)||a.p.firm.localeCompare(b.p.firm)});

  $('#pst').innerHTML=opts;
